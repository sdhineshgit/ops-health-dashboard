name: Test and deploy to k3s

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ops-health-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install and test
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q

  deploy:
    defaults:
      run:
        shell: bash
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require deploy secrets
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          missing=0
          for name in ADMIN_PASSWORD SESSION_SECRET KUBE_CONFIG GHCR_PULL_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub secret: $name"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Point the Deployment at this image
        run: |
          sed -i "s|ops-health-dashboard:local|${IMAGE}:${GITHUB_SHA}|" deploy/k3s/deployment.yaml
          if [ -n "${{ vars.HEALTH_HOST }}" ]; then
            sed -i "s|health.internal|${{ vars.HEALTH_HOST }}|" deploy/k3s/ingress.yaml
          fi

      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply to k3s
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          kubectl apply -f deploy/k3s/namespace.yaml
          kubectl -n ops-health create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n ops-health create secret generic ops-health-config \
            --from-literal=ADMIN_USERNAME="${ADMIN_USERNAME:-admin}" \
            --from-literal=ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            --from-literal=SESSION_SECRET="$SESSION_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -k deploy/k3s
          kubectl -n ops-health rollout status deployment/ops-health --timeout=180s
