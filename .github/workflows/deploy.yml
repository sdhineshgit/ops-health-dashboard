name: Test and deploy to k3s

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ops-health-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install and test
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Require deploy secrets
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          $missing = $false
          foreach ($name in @("ADMIN_PASSWORD", "SESSION_SECRET", "KUBE_CONFIG", "GHCR_PULL_TOKEN")) {
            $value = (Get-Item -Path "Env:$name" -ErrorAction SilentlyContinue).Value
            if ([string]::IsNullOrWhiteSpace($value)) {
              Write-Host "Missing GitHub secret: $name"
              $missing = $true
            }
          }
          if ($missing) { exit 1 }

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Point the Deployment at this image
        run: |
          $utf8 = New-Object System.Text.UTF8Encoding $false
          $deploymentPath = Join-Path (Get-Location) "deploy/k3s/deployment.yaml"
          $deployment = [IO.File]::ReadAllText($deploymentPath)
          $image = "$($env:IMAGE):$($env:GITHUB_SHA)"
          $deployment = $deployment.Replace("ops-health-dashboard:local", $image)
          [IO.File]::WriteAllText($deploymentPath, $deployment, $utf8)
          $healthHost = "${{ vars.HEALTH_HOST }}"
          if (-not [string]::IsNullOrWhiteSpace($healthHost)) {
            $ingressPath = Join-Path (Get-Location) "deploy/k3s/ingress.yaml"
            $ingress = [IO.File]::ReadAllText($ingressPath)
            $ingress = $ingress.Replace("health.internal", $healthHost)
            [IO.File]::WriteAllText($ingressPath, $ingress, $utf8)
          }

      - name: Configure kubectl
        run: |
          $kubeDir = Join-Path $env:USERPROFILE ".kube"
          New-Item -ItemType Directory -Force -Path $kubeDir | Out-Null
          $encoded = ($env:KUBE_CONFIG -replace "\s", "")
          [IO.File]::WriteAllBytes((Join-Path $kubeDir "config"), [Convert]::FromBase64String($encoded))

      - name: Apply to k3s
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          $adminUser = $env:ADMIN_USERNAME
          if ([string]::IsNullOrWhiteSpace($adminUser)) { $adminUser = "admin" }
          kubectl apply -f deploy/k3s/namespace.yaml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl -n ops-health create secret docker-registry ghcr-pull --docker-server=ghcr.io --docker-username="${{ github.actor }}" --docker-password="$env:GHCR_PULL_TOKEN" --dry-run=client -o yaml | kubectl apply -f -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl -n ops-health create secret generic ops-health-config --from-literal=ADMIN_USERNAME="$adminUser" --from-literal=ADMIN_PASSWORD="$env:ADMIN_PASSWORD" --from-literal=SESSION_SECRET="$env:SESSION_SECRET" --dry-run=client -o yaml | kubectl apply -f -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl apply -k deploy/k3s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl -n ops-health rollout status deployment/ops-health --timeout=180s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
