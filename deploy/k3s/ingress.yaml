apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ops-health
  namespace: ops-health
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: health.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ops-health
                port:
                  number: 8080
