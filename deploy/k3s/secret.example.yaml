# Example only. Do not commit real passwords.
# CI creates this secret from GitHub Actions secrets before kubectl apply.
apiVersion: v1
kind: Secret
metadata:
  name: ops-health-config
  namespace: ops-health
type: Opaque
stringData:
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: replace-with-a-long-password
  SESSION_SECRET: replace-with-a-long-random-string
