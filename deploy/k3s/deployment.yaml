apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-health
  namespace: ops-health
  labels:
    app: ops-health
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ops-health
  template:
    metadata:
      labels:
        app: ops-health
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: web
          image: ops-health-dashboard:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: Asia/Kolkata
            - name: DATABASE_PATH
              value: /data/health.db
          envFrom:
            - secretRef:
                name: ops-health-config
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ops-health-data
